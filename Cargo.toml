# QuantRadar workspace manifest
[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/exchange-kraken",
  "crates/features",
  "crates/screeners",
  "crates/regime",
  "crates/backtest",
  "crates/reporting",
  "crates/microstructure",
  "crates/research",
  "crates/execution",
  "crates/cli",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.2.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
