# QuantRadar Python research environment
[build-system]
requires=["hatchling>=1.25"]
build-backend="hatchling.build"
[project]
name="quantaradar-research"
version="0.1.0"
description="Research, ML and walk-forward validation layer for QuantRadar"
requires-python=">=3.12"
dependencies=["numpy>=2.0","pandas>=2.2","pyarrow>=17","scikit-learn>=1.5","scipy>=1.14","statsmodels>=0.14","duckdb>=1.0","optuna>=4.0","plotly>=5.24","pydantic>=2.9","pyyaml>=6.0"]
[project.optional-dependencies]
ml=["xgboost>=2.1","lightgbm>=4.5","shap>=0.46"]
dev=["pytest>=8","pytest-cov>=5","ruff>=0.7","mypy>=1.13"]
[tool.hatch.build.targets.wheel]
packages=["python/quantaradar"]
